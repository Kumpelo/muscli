name: Bug report
description: Report a reproducible muscli problem
title: "[bug] "
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux / Omarchy, Windows 11]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: muscli doctor output
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
