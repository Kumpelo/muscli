name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cpal links against ALSA on Linux; the runners do not ship its headers.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      - run: cargo build --release --locked
      - name: Assemble archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p "dist/muscli-v${version}-linux-x86_64"
          cp target/release/muscli LICENSE THIRD_PARTY_NOTICES.md "dist/muscli-v${version}-linux-x86_64/"
          tar -C dist -czf "dist/muscli-v${version}-linux-x86_64.tar.gz" "muscli-v${version}-linux-x86_64"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: dist/*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      - run: cargo build --release --locked
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build verified installer
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version "${{ github.ref_name }}".Substring(1)
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: dist/*-setup.exe

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate SBOM and checksums
        shell: bash
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --format json
          mv muscli.cdx.json dist/muscli.cdx.json
          cd dist
          sha256sum * > SHA256SUMS
      - name: Attest public release artifacts
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.exe
            dist/muscli.cdx.json
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*
