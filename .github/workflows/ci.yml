name: CI

on:
  push:
    branches: [main, master, "review/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      # Benchmarks are not run here: timings on shared runners are too noisy to
      # gate on. Compiling them still catches API drift in the bench targets.
      - run: cargo bench --no-run --locked
      - run: cargo build --release --locked

  msrv:
    name: MSRV 1.90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Must match rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.120
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --locked

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    # Licence and source checks. Release artifacts ship a THIRD_PARTY_NOTICES.md,
    # so an incompatible licence entering the tree is a release blocker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources
