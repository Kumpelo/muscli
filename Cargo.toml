[package]
name = "muscli"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A fast local FLAC library and terminal player for Omarchy"
license = "MIT"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
directories = "6.0"
discord-rich-presence = "1.1"
fs4 = "1.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lofty = "0.25.2"
mpris-server = { version = "0.10.0", features = ["tokio"] }
notify = "8.2"
rand = "0.9"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "all-widgets"] }
ratatui-image = { version = "11.0.8", default-features = false, features = ["crossterm"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt", "sync", "time", "signal"] }
toml = "0.9"
unicode-normalization = "0.1"
url = "2.5"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
